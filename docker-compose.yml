version: '3.8'

services:
  # Relational Database Layer
  db:
    image: postgres:15-alpine
    container_name: benchmark-postgres
    restart: always
    environment:
      POSTGRES_DB: benchmark_justice
      POSTGRES_USER: justice_admin
      POSTGRES_PASSWORD: superSecurePassword123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Caching Layer
  redis:
    image: redis:7-alpine
    container_name: benchmark-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # Full-Text Search Indexing Layer
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.1
    container_name: benchmark-elasticsearch
    restart: always
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data

  # Frontend Application Layer
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: benchmark-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DATABASE_URL=postgresql://justice_admin:superSecurePassword123@db:5432/benchmark_justice
      - REDIS_URL=redis://redis:6379
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - BACKEND_API_URL=http://localhost:8000/api
    depends_on:
      - db
      - redis
      - elasticsearch

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  es_data:
    driver: local
